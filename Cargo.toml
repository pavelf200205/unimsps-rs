[package]
name = "unimsps"
version = "0.1.0"
edition = "2024"
license = "CECILL-2.1"

[features]
default = []
cuda = ["burn/cuda"]

[dependencies]
anyhow = "1"
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu", "flex", "fusion", "autotune", "extension"] }
burn-backend = { version = "=0.22.0", default-features = false }
burn-cubecl = { version = "=0.22.0", default-features = false, features = ["std", "fusion"] }
burn-fusion = { version = "=0.22.0", default-features = false, features = ["std"] }
cubek = { version = "=0.3.0", default-features = false, features = ["attention"] }
cubecl = { version = "=0.11.0", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr"] }
safetensors = "0.6"
half = "2"
rayon = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
